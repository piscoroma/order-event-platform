image:
  repository: grafana/grafana
  tag: 13.2.2-distroless

admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

service:
  type: ClusterIP
  port: 3000

persistence:
  enabled: true
  size: 5Gi

grafana.ini:
  plugins:
    preinstall_auto_update: false

ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - grafana.local
  tls: []

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki:3100
        isDefault: false
        
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-kube-prometheus-prometheus.observability.svc.cluster.local:9090
        isDefault: true
        editable: true

