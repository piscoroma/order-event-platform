{{- if .Values.mongo.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 60
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mongo-init
          image: {{ .Values.mongo.image }}
          command:
            - sh
            - -c
            - |
              echo "Waiting MongoDB..."

              for i in $(seq 1 60); do
                if mongosh --host mongo:27017 \
                    --quiet \
                    --eval "db.adminCommand('ping')" >/dev/null 2>&1
                then
                  echo "MongoDB ready"
                  break
                fi

                echo "Mongo not ready yet ($i/60)"
                sleep 2
              done

              if ! mongosh --host mongo:27017 \
                    --quiet \
                    --eval "db.adminCommand('ping')" >/dev/null 2>&1
              then
                echo "MongoDB unavailable after timeout"
                exit 1
              fi

              echo "Initializing Mongo replica set..."

              mongosh --host mongo:27017 --quiet --eval '
                try {
                  const status = rs.status()
                  print("Replica set already initialized")
                } catch (e) {
                  rs.initiate({
                    _id: "rs0",
                    members: [
                      { _id: 0, host: "mongo:27017" }
                    ]
                  })
                  print("Replica set initialized")
                }
              '

              echo "Waiting for PRIMARY..."

              for i in $(seq 1 60); do
                if mongosh --host mongo:27017 --quiet \
                    --eval "db.hello().isWritablePrimary" | grep -q true
                then
                  echo "Mongo PRIMARY ready"
                  break
                fi

                echo "Waiting Mongo PRIMARY ($i/60)"
                sleep 2
              done

              if ! mongosh --host mongo:27017 --quiet \
                  --eval "db.hello().isWritablePrimary" | grep -q true
              then
                echo "Mongo did not become PRIMARY"
                exit 1
              fi

              echo "Creating application users..."

              mongosh --host mongo:27017 --quiet <<'EOF'

              function ensureUser(database, username, password) {
                const dbRef = db.getSiblingDB(database);

                if (dbRef.getUser(username) == null) {
                  dbRef.createUser({
                    user: username,
                    pwd: password,
                    roles: [
                      {
                        role: "readWrite",
                        db: database
                      }
                    ]
                  });

                  print(`User ${username} created on ${database}`);
                } else {
                  print(`User ${username} already exists`);
                }
              }

              ensureUser("inventory_db", "inventory_svc", "inventory_pass");
              ensureUser("auth_db", "auth_svc", "auth_pass");

              EOF

              echo "Mongo initialization completed"
{{- end }}
