replicaCount: 1

image:
  repository: ghcr.io/piscoroma/inventory-service
  tag: latest
  pullPolicy: Always
  
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 3010
  
ingressRoute:
  enabled: false

env:
  NODE_ENV: test
  SHUTDOWN_TIMEOUT: 25000
  LOG_LEVEL: info
  MONGO_HOST: mongo.order-event-platform
  MONGO_PORT: 27017
  MONGO_DB_NAME: inventory_db
  MONGO_REPLICA_SET: rs0
  NATS_URL: "nats://nats.order-event-platform:4222"

jwt:
  mountPath: /app/certs

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 15
  readiness:
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 10
    
serviceAccount:
  create: true
  name: ""

