inventory-service:

#  image:
#    repository: inventory-service
#    tag: test
#    pullPolicy: Never
  
  ingressRoute:
    enabled: true
    entryPoints:
      - websecure
    host: inventory.example.local
    tls:
      enabled: false
      secretName: ""

  env:
    NODE_ENV: test
    NATS_URL: "nats://nats.order-event-platform:4222"
    MONGO_HOST: mongo.order-event-platform
#    LOG_LEVEL: debug

  secretName: inventory-service-secrets
  
auth-service:

#  image:
#    repository: auth-service
#    tag: test
#    pullPolicy: Never
  
  ingressRoute:
    enabled: true
    entryPoints:
      - websecure
    host: auth.example.local
    tls:
      enabled: false
      secretName: ""

  env:
    NODE_ENV: test
    MONGO_HOST: mongo.order-event-platform
#    LOG_LEVEL: debug
  
  jwt:
    mountPath: /app/certs

external-services:
  enabled: true
  mongo:
    host: 192.168.1.175
    port: 27017
  nats:
    host: 192.168.1.175
    clientPort: 4222
    monitorPort: 8222
    
test-dependencies:
  enabled: false
