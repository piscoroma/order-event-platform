inventory-service:
  image:
    repository: inventory-service
    pullPolicy: Never
    
  seed:
    enabled: true
  
auth-service:
  image:
    repository: auth-service
    pullPolicy: Never
  
  seed:
    enabled: true

ingress: 
  enabled: true
  host: api.order-event-platform
  tls:
    enabled: true
    secretName: order-event-platform-tls
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
