inventory-service:
  image:
    repository: inventory-service
    pullPolicy: Never
  
auth-service:
  image:
    repository: auth-service
    pullPolicy: Never

ingress: 
  enabled: true
  host: api.order-event-platform
  tls:
    enabled: true
    secretName: order-event-platform-tls
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
