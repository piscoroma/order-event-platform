name: CI/CD


on:
#  push:
#    branches:
#      - main

  workflow_dispatch:


permissions:
  contents: read
  packages: write
  actions: read
  
env:
  IMAGE_TAG: test
  
jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint
       
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test
        
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration
        
  changes:
    needs:
      - lint
      - unit-test
      - integration-test
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
        
      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v4
        with:
          list-files: shell
          filters: |
            inventory-service:
              - 'services/inventory-service/**'
              - 'shared/**'
              - 'package.json'
              - 'package-lock.json'
              - 'docker/**'
              
            auth-service:
              - 'services/auth-service/**'
              - 'shared/**'
              - 'package.json'
              - 'package-lock.json'
              - 'docker/**'  
      
      - name: Show changed services
        run: |
          echo "Changed services: ${{ steps.filter.outputs.changes }}"
  
  build:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: inventory-service
          - service: auth-service
            
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Set up Docker Buildx
        if: contains(fromJson(needs.changes.outputs.services), matrix.service) || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v4
            
      - name: Build image
        if: contains(fromJson(needs.changes.outputs.services), matrix.service) || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile

          build-args: |
            SERVICE_NAME=${{ matrix.service }}

          push: false
          load: true
          
          tags: ${{ matrix.service }}:${{ env.IMAGE_TAG }}

          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Save Docker image
        if: contains(fromJson(needs.changes.outputs.services), matrix.service) || github.event_name == 'workflow_dispatch'
        run: |
          docker save \
            -o ${{ matrix.service }}.tar \
            ${{ matrix.service }}:test

      - name: Upload Docker image
        if: contains(fromJson(needs.changes.outputs.services), matrix.service) || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.service }}-image
          path: ${{ matrix.service }}.tar
          
  helm-validation:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Validate Helm charts
        run: |
          helm dependency update infra/k8s/helm

          echo "===> Lint umbrella"
          helm lint \
            infra/k8s/helm \
            -f infra/k8s/helm/values-kind.yaml
  
          echo "===> Lint inventory-service"
          helm lint infra/k8s/helm/charts/inventory-service

          echo "===> Lint auth-service"
          helm lint infra/k8s/helm/charts/auth-service

          echo "===> Render umbrella"
          helm template \
            order-event-platform \
            infra/k8s/helm \
            -f infra/k8s/helm/values-kind.yaml > /dev/null
            
  helm-smoke-test:
    needs: 
      - build
      - helm-validation
    runs-on: ubuntu-latest
    
    env:
      INVENTORY_MONGO_USERNAME: ${{ secrets.INVENTORY_MONGO_USERNAME }}
      INVENTORY_MONGO_PASSWORD: ${{ secrets.INVENTORY_MONGO_PASSWORD }}
      AUTH_MONGO_USERNAME: ${{ secrets.AUTH_MONGO_USERNAME }}
      AUTH_MONGO_PASSWORD: ${{ secrets.AUTH_MONGO_PASSWORD }}
          
    steps:
      - name: Checkout repository 
        uses: actions/checkout@v6

      - name: Download inventory image
        uses: actions/download-artifact@v8
        with:
          name: inventory-service-image

      - name: Download auth image
        uses: actions/download-artifact@v8
        with:
          name: auth-service-image

      - name: Load Docker image
        run: |
          docker load -i inventory-service.tar
          docker load -i auth-service.tar

      - name: Create Kind cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: smoke-test

      - name: Create namespace
        run: |
          kubectl create namespace order-event-platform --dry-run=client -o yaml | kubectl apply -f -

      - name: Generate JWT keypair
        run: |
          mkdir jwt
          openssl ecparam -name prime256v1 -genkey -noout -out jwt/private.pem
          openssl ec -in jwt/private.pem -pubout -out jwt/public.pem
      
      - name: Create Kubernetes Secrets
        run: |
          kubectl create secret generic inventory-service-db-secret \
            --namespace order-event-platform \
            --from-literal=MONGO_USERNAME="$INVENTORY_MONGO_USERNAME" \
            --from-literal=MONGO_PASSWORD="$INVENTORY_MONGO_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
            
          kubectl create secret generic auth-service-db-secret \
            --namespace order-event-platform \
            --from-literal=MONGO_USERNAME="$AUTH_MONGO_USERNAME" \
            --from-literal=MONGO_PASSWORD="$AUTH_MONGO_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
          
          kubectl create secret generic auth-service-jwt-private-key-secret \
            --namespace order-event-platform \
            --from-file=private.pem=jwt/private.pem \
            --dry-run=client -o yaml | kubectl apply -f -
            
          kubectl create configmap jwt-public-key \
            --namespace order-event-platform \
            --from-literal=public.pem=jwt/public.pem \
            --dry-run=client -o yaml | kubectl apply -f -
            
          openssl req -x509 -nodes -days 365 \
            -newkey rsa:4096 \
            -keyout tls.key \
            -out tls.crt \
            -subj "/CN=api.order-event-platform"
          kubectl create secret tls order-event-platform-tls \
            --cert=tls.crt \
            --key=tls.key \
            -n order-event-platform

      - name: Load images into Kind
        run: |
          kind load docker-image inventory-service:${{ env.IMAGE_TAG }} --name smoke-test
          kind load docker-image auth-service:${{ env.IMAGE_TAG }} --name smoke-test

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Deploy umbrella chart
        run: |
          helm dependency update infra/k8s/helm
          
          helm upgrade --install \
          order-event-platform \
          infra/k8s/helm \
          --namespace order-event-platform \
          -f infra/k8s/helm/values-kind.yaml \
          --set inventory-service.image.tag=test \
          --set auth-service.image.tag=test 

      - name: Wait rollout
        run: |
          for deployment in \
            order-event-platform-inventory-service \
            order-event-platform-auth-service
          do
            kubectl rollout status deployment/$deployment \
              -n order-event-platform \
              --timeout=120s
          done

      - name: Show resources
        if: always()
        run: |
          kubectl get all -n order-event-platform

      - name: Show logs
        if: failure()
        run: |
          kubectl describe pods -n order-event-platform
          
          for deploy in \
            order-event-platform-inventory-service \
            order-event-platform-auth-service
          do
            echo "===================="
            echo "$deploy"
            echo "===================="

            kubectl logs \
              deployment/$deploy \
              -n order-event-platform \
              --all-containers=true || true
          done

  push:
    needs:
      - helm-smoke-test
      - changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: inventory-service
          - service: auth-service

    steps:
      - name: Download Docker image
        if: contains(fromJson(needs.changes.outputs.services), matrix.service) || github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.service }}-image

      - name: Load Docker image
        if: contains(fromJson(needs.changes.outputs.services), matrix.service) || github.event_name == 'workflow_dispatch'
        run: |
          docker load -i ${{ matrix.service }}.tar

      - name: Login to GHCR
        if: contains(fromJson(needs.changes.outputs.services), matrix.service) || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        if: contains(fromJson(needs.changes.outputs.services), matrix.service) || github.event_name == 'workflow_dispatch'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Tag image
        if: contains(fromJson(needs.changes.outputs.services), matrix.service) || github.event_name == 'workflow_dispatch'
        run: |
          while IFS= read -r tag; do
            docker tag ${{ matrix.service }}:test "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"

      - name: Push image
        if: contains(fromJson(needs.changes.outputs.services), matrix.service) || github.event_name == 'workflow_dispatch'
        run: |
          while IFS= read -r tag; do
            docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"



