name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/workflows/cd.yml'
      - '.github/workflows/security.yml'
      - 'README.md'
      
  pull_request:
  
  workflow_dispatch:


permissions:
  contents: read
  packages: write
  actions: read

  
jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint
       
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test
        
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration
          
  helm-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Validate Helm charts
        run: |
          helm dependency update infra/k8s/helm

          echo "===> Lint umbrella"
          helm lint \
            infra/k8s/helm \
            -f infra/k8s/helm/values-kind.yaml
  
          echo "===> Lint inventory-service"
          helm lint infra/k8s/helm/charts/inventory-service

          echo "===> Lint auth-service"
          helm lint infra/k8s/helm/charts/auth-service

          echo "===> Render umbrella"
          helm template \
            order-event-platform \
            infra/k8s/helm \
            -f infra/k8s/helm/values-kind.yaml > /dev/null
