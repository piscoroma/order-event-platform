name: CD

on:
#  push:
#    branches:
#      - main

#  pull_request:

  workflow_dispatch:
    inputs:
      force_image_build:
        description: "Force Docker image builds"
        required: false
        default: false
        type: boolean
        
      run_e2e:
        description: "Run E2E tests"
        required: false
        default: true
        type: boolean


permissions:
  contents: read
  packages: write
  actions: read
  
env:
  # Add new microservices here.
  # The rest of the pipeline will use this list automatically.
  SERVICES: '["inventory-service", "auth-service"]'
  
jobs:
        
  # ===========================================================================
  # Detect changes
  # ===========================================================================

  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
      services_to_build: ${{ steps.build-list.outputs.services }}
      build_matrix: ${{ steps.build-list.outputs.matrix }}
      has_services: ${{ steps.build-list.outputs.has_services }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
        
      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v4
        with:
          list-files: shell
          filters: |
            inventory-service:
              - 'services/inventory-service/**'
              - 'shared/**'
              - 'package.json'
              - 'package-lock.json'
              - 'docker/**'
              
            auth-service:
              - 'services/auth-service/**'
              - 'shared/**'
              - 'package.json'
              - 'package-lock.json'
              - 'docker/**'  
      
      - name: Show changed services
        run: |
          echo "Changed services: ${{ steps.filter.outputs.changes }}"
          
      - name: Determine services to build
        id: build-list
        env:
          CHANGED_SERVICES: ${{ steps.filter.outputs.changes }}
          FORCE_IMAGE_BUILD: ${{ inputs.force_image_build || false }}
          ALL_SERVICES: ${{ env.SERVICES }}
        run: |
          python3 <<'PY'
          import json
          import os

          changed_services = json.loads(os.environ["CHANGED_SERVICES"])
          all_services = json.loads(os.environ["ALL_SERVICES"])
          force_image_build = os.environ["FORCE_IMAGE_BUILD"].lower() == "true"

          if force_image_build:
            services = all_services
          else:
            services = changed_services
              
          matrix = {
            "service": services
          }
          
          print(f"Force image build: {force_image_build}")
          print(f"Services to build: {services}")
          print(f"Build matrix: {matrix}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"services={json.dumps(services)}\n")
              output.write(f"matrix={json.dumps(matrix)}\n")
              output.write(f"has_services={str(bool(services)).lower()}\n")
          PY
  
  # ===========================================================================
  # Build Docker images
  # ===========================================================================

  build:
    needs: changes    
    if: ${{ needs.changes.outputs.has_services == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.changes.outputs.build_matrix) }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
            
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile

          build-args: |
            SERVICE_NAME=${{ matrix.service }}

          push: false
          load: true
          
          # "test" is a temporary local tag used only by the CD pipeline.
          tags: ${{ matrix.service }}:test

          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Save Docker image
        run: |
          docker save \
            -o ${{ matrix.service }}.tar \
            ${{ matrix.service }}:test

      - name: Upload Docker image
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.service }}-image
          path: ${{ matrix.service }}.tar
          
            
  # ===========================================================================
  # Kind / integration / E2E tests
  # ===========================================================================
  
  kind-test:
    needs: 
      - changes
      - build
    
    # Run also when build is skipped because there are no changed services.
    # In that case the test environment uses the images currently referenced
    # by values-k3s.yaml.
    if: >-
      ${{
        always() &&
        (
          needs.build.result == 'success' ||
          needs.build.result == 'skipped'
        )
      }}
    
    runs-on: ubuntu-latest
    
    env:
      INVENTORY_MONGO_USERNAME: ${{ secrets.INVENTORY_MONGO_USERNAME }}
      INVENTORY_MONGO_PASSWORD: ${{ secrets.INVENTORY_MONGO_PASSWORD }}
      AUTH_MONGO_USERNAME: ${{ secrets.AUTH_MONGO_USERNAME }}
      AUTH_MONGO_PASSWORD: ${{ secrets.AUTH_MONGO_PASSWORD }}
          
    steps:
      - name: Checkout repository 
        uses: actions/checkout@v6

      # -------------------------------------------------------------------------
      # Docker images
      # -------------------------------------------------------------------------
          
      - name: Install Python dependencies
        run: |
          pip install ruamel.yaml

      - name: Download built Docker images
        if: ${{ needs.changes.outputs.has_services == 'true' }}
        uses: actions/download-artifact@v8
        with:
          path: /tmp/images

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image configuration
        env:
          ALL_SERVICES: ${{ env.SERVICES }}
          SERVICES_TO_BUILD: ${{ needs.changes.outputs.services_to_build }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          python3 <<'PY'
          import json
          import os

          from ruamel.yaml import YAML


          all_services = json.loads(os.environ["ALL_SERVICES"])
          services_to_build = set(json.loads(os.environ["SERVICES_TO_BUILD"]))
          owner = os.environ["GITHUB_REPOSITORY_OWNER"]

          yaml = YAML()

          with open(
              "infra/k8s/helm/values-k3s.yaml", "r", encoding="utf-8",
          ) as file:
              values = yaml.load(file)

          image_config = {}

          for service in all_services:
              if service in services_to_build:
                  repository = service
                  tag = "test"
                  build = True
                  print(f"{service}: using local image {repository}:{tag}")
                  
              else:
                  repository = f"ghcr.io/{owner}/{service}"
                  tag = values[service]["image"]["tag"]
                  build = False
                  print(f"{service}: using existing image {repository}:{tag}")

              image_config[service] = {
                  "repository": repository,
                  "tag": tag,
                  "build": build,
              }

          with open(
              "/tmp/image-config.json", "w", encoding="utf-8",
          ) as file:
              json.dump(image_config, file, indent=2)

          # Generate Helm arguments dynamically.
          with open(
              "/tmp/helm-image-args", "w", encoding="utf-8",
          ) as file:
              for service, config in image_config.items():
                  prefix = f"{service}.image"
                  file.write("--set-string\n")
                  file.write(f"{prefix}.repository={config['repository']}\n")
                  file.write("--set-string\n")
                  file.write("{prefix}.tag={config['tag']}\n")
                  file.write("--set-string\n")
                  file.write(f"{prefix}.pullPolicy=IfNotPresent\n")
          PY

          echo "Image configuration:"
          cat /tmp/image-config.json

      # -------------------------------------------------------------------------
      # Kind
      # -------------------------------------------------------------------------
      
      - name: Create Kind configuration
        run: |
          cat > /tmp/kind-config.yaml <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
              extraPortMappings:
                - containerPort: 80
                  hostPort: 80
                  protocol: TCP
                - containerPort: 443
                  hostPort: 443
                  protocol: TCP
          EOF

      - name: Create Kind cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: smoke-test
          config: /tmp/kind-config.yaml
          
      - name: Configure E2E hostname
        run: |
          echo "127.0.0.1 api.order-event-platform" | sudo tee -a /etc/hosts
          
      # -------------------------------------------------------------------------
      # Load Docker images into Kind
      # -------------------------------------------------------------------------
      
      - name: Load Docker images
        env:
          ALL_SERVICES: ${{ env.SERVICES }}
        run: |
          python3 <<'PY'
          import json
          import subprocess
          import os


          all_services = json.loads(os.environ["ALL_SERVICES"])

          with open(
            "/tmp/image-config.json", "r", encoding="utf-8",
          ) as file:
              image_config = json.load(file)

          for service in all_services:
              config = image_config[service]

              repository = config["repository"]
              tag = config["tag"]
              image = f"{repository}:{tag}"

              if config["build"]:
                  image_tar = f"/tmp/images/{service}-image/{service}.tar"
                  print(f"Loading locally built image: {image}")
                  subprocess.run(
                      ["docker", "load", "-i", image_tar],
                      check=True,
                  )

              else:
                  print(f"Pulling existing image: {image}")
                  subprocess.run(
                      ["docker", "pull", image],
                      check=True,
                  )

              print(f"Loading image into Kind: {image}")

              subprocess.run(
                  [
                      "kind",
                      "load",
                      "docker-image",
                      image,
                      "--name",
                      "smoke-test",
                  ],
                  check=True,
              )
          PY

      # -------------------------------------------------------------------------
      # Traefik
      # -------------------------------------------------------------------------
          
      - name: Install Traefik
        run: |
          helm repo add traefik https://traefik.github.io/charts
          helm repo update

          helm upgrade --install traefik traefik/traefik \
            --namespace traefik \
            --create-namespace \
            --set ports.web.hostPort=80 \
            --set ports.websecure.hostPort=443 \
            --set service.type=ClusterIP
            
      - name: Wait for Traefik
        run: |
          kubectl wait \
            --namespace traefik \
            --for=condition=ready pod \
            -l app.kubernetes.io/name=traefik \
            --timeout=120s

      # -------------------------------------------------------------------------
      # Kubernetes secrets
      # -------------------------------------------------------------------------

      - name: Create namespace
        run: |
          kubectl create namespace order-event-platform --dry-run=client -o yaml | kubectl apply -f -
      
      - name: Generate JWT keypair
        run: |
          mkdir jwt
          openssl ecparam -name prime256v1 -genkey -noout -out jwt/private.pem
          openssl ec -in jwt/private.pem -pubout -out jwt/public.pem
      
      - name: Create Mongo secrets
        run: |
          kubectl create secret generic inventory-service-db-secret \
            --namespace order-event-platform \
            --from-literal=MONGO_USERNAME="$INVENTORY_MONGO_USERNAME" \
            --from-literal=MONGO_PASSWORD="$INVENTORY_MONGO_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
            
          kubectl create secret generic auth-service-db-secret \
            --namespace order-event-platform \
            --from-literal=MONGO_USERNAME="$AUTH_MONGO_USERNAME" \
            --from-literal=MONGO_PASSWORD="$AUTH_MONGO_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
          
      - name: Create JWT private key secret
        run: |
          kubectl create secret generic auth-service-jwt-private-key-secret \
            --namespace order-event-platform \
            --from-file=private.pem=jwt/private.pem \
            --dry-run=client -o yaml | kubectl apply -f -
            
      - name: Create JWT public key ConfigMap
        run: |
          kubectl create configmap jwt-public-key \
            --namespace order-event-platform \
            --from-file=public.pem=jwt/public.pem \
            --dry-run=client -o yaml | kubectl apply -f -
      
      # -------------------------------------------------------------------------
      # TLS
      # -------------------------------------------------------------------------
      
      - name: Generate self-signed TLS certificate
        run: |
          openssl req -x509 -nodes -days 365 \
            -newkey rsa:4096 \
            -keyout tls.key \
            -out tls.crt \
            -subj "/CN=api.order-event-platform"
      
      - name: Create TLS secret
        run: |
          kubectl create secret tls order-event-platform-tls \
            --cert=tls.crt \
            --key=tls.key \
            -n order-event-platform

      # -------------------------------------------------------------------------
      # Helm
      # -------------------------------------------------------------------------

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Deploy umbrella chart
        run: |
          helm dependency update infra/k8s/helm
          
          mapfile -t IMAGE_ARGS < /tmp/helm-image-args
          
          helm upgrade --install \
          order-event-platform \
          infra/k8s/helm \
          --namespace order-event-platform \
          -f infra/k8s/helm/values-kind.yaml \
          "${IMAGE_ARGS[@]}"

      # -------------------------------------------------------------------------
      # Wait for deployment
      # -------------------------------------------------------------------------

      - name: Wait rollout
        if: success()
        env:
          ALL_SERVICES: ${{ env.SERVICES }}
        run: |
          for service in $(echo "$ALL_SERVICES" | jq -r '.[]'); do
            deployment="order-event-platform-${service}"

            kubectl rollout status \
              "deployment/${deployment}" \
              -n order-event-platform \
              --timeout=120s
          done
      
      - name: Show resources
        if: always()
        run: |
          kubectl get all -n order-event-platform

      - name: Show logs
        if: failure()
        env:
          ALL_SERVICES: ${{ env.SERVICES }}
        run: |
          echo "===================="
          echo "PODS"
          echo "===================="
          kubectl get pods -n order-event-platform -o wide

          echo "===================="
          echo "EVENTS"
          echo "===================="
          kubectl get events \
            -n order-event-platform \
            --sort-by='.lastTimestamp'

          echo "===================="
          echo "DEPLOYMENT LOGS"
          echo "===================="

          for service in $(echo "$ALL_SERVICES" | jq -r '.[]'); do
            deploy="order-event-platform-${service}"
            
            echo "--------------------"
            echo "$deploy"
            echo "--------------------"

            kubectl logs \
              deployment/${deploy} \
              -n order-event-platform \
              --all-containers=true || true
          done

          echo "===================="
          echo "SEED JOB LOGS"
          echo "===================="

          for service in $(echo "$ALL_SERVICES" | jq -r '.[]'); do
            job="order-event-platform-${service}-seed"
            
            echo "--------------------"
            echo "$job"
            echo "--------------------"

            kubectl logs \
              job/${job} \
              -n order-event-platform || true
          done

      # -------------------------------------------------------------------------
      # NATS
      # -------------------------------------------------------------------------

      - name: Start NATS port-forward
        run: |
          kubectl port-forward \
            -n order-event-platform \
            svc/nats \
            4222:4222 \
            > /tmp/nats-port-forward.log 2>&1 &

          sleep 2

          cat /tmp/nats-port-forward.log
      
      # -------------------------------------------------------------------------
      # Node.js / E2E
      # -------------------------------------------------------------------------

      - name: Setup Node.js
        if: github.event_name != 'workflow_dispatch' || inputs.run_e2e
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: github.event_name != 'workflow_dispatch' || inputs.run_e2e
        run: npm ci

      - name: Install Playwright browsers
        if: github.event_name != 'workflow_dispatch' || inputs.run_e2e
        run: npx playwright install --with-deps chromium

      - name: Create E2E environment
        if: github.event_name != 'workflow_dispatch' || inputs.run_e2e
        run: |
          cat > tests/e2e/.env.e2e <<'EOF'
          AUTH_SERVICE_URL=https://api.order-event-platform:443/auth/
          INVENTORY_SERVICE_URL=https://api.order-event-platform:443/inventory/
          NATS_URL=nats://127.0.0.1:4222
          IGNORE_TLS_ERRORS=true
          EOF

      - name: Run E2E tests
        if: github.event_name != 'workflow_dispatch' || inputs.run_e2e
        run: npm run test:e2e

      # -------------------------------------------------------------------------
      # Playwright artifacts
      # -------------------------------------------------------------------------

      - name: Upload Playwright report
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.run_e2e)
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 7
      
      - name: Upload Playwright test results
        if: always() && (github.event_name != 'workflow_dispatch' || inputs.run_e2e)
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: tests/e2e/test-results/
          retention-days: 7

  push-images:
    needs:
      - kind-test
      - changes
    if: ${{ needs.changes.outputs.has_services == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix: ${{ fromJson(needs.changes.outputs.build_matrix) }}

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.service }}-image

      - name: Load Docker image
        run: |
          docker load -i ${{ matrix.service }}.tar

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
          tags: |
            type=sha

      - name: Tag image
        run: |
          while IFS= read -r tag; do
            docker tag ${{ matrix.service }}:test "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"

      - name: Push image
        run: |
          while IFS= read -r tag; do
            docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"

  # ===========================================================================
  # Update Kubernetes manifests
  # ===========================================================================

  update-manifests:
    needs:
      - push-images
      - changes
    if: ${{ needs.changes.outputs.has_services == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Python dependencies
        run: pip install ruamel.yaml

      - name: Update image tags
        env:
          SERVICES_TO_BUILD: ${{ needs.changes.outputs.services_to_build }}
        run: |
          python3 <<'PY'
          import json
          import os
          from pathlib import Path
          
          from ruamel.yaml import YAML


          VALUES_FILE = Path("infra/k8s/helm/values-k3s.yaml")

          yaml = YAML()
          yaml.preserve_quotes = True
          yaml.width = 4096

          services = json.loads(os.environ["SERVICES_TO_BUILD"])

          image_tag = f"sha-{os.environ['GITHUB_SHA'][:7]}"

          print(f"Services to update: {services}")
          print(f"New image tag: {image_tag}")

          with VALUES_FILE.open("r", encoding="utf-8") as file:
              values = yaml.load(file)

          for service in services:
            if service not in values:
              print(f"Service not found: {service}")
              continue

            print(f"Updating {service} to {image_tag}")

            values[service]["image"]["tag"] = image_tag
            values[service]["image"]["pullPolicy"] = "IfNotPresent"

          with VALUES_FILE.open("w", encoding="utf-8") as file:
              yaml.dump(values, file)
          PY

      - name: Show changes
        run: |
          git diff -- infra/k8s/helm/values-k3s.yaml

      - name: Commit and push manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add infra/k8s/helm/values-k3s.yaml

          if git diff --cached --quiet; then
            echo "No manifest changes to commit"
            exit 0
          fi

          git commit -m "chore(deploy): update image tags [skip ci]"
          git push


   


