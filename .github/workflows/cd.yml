name: CD

on:
#  push:
#    branches:
#      - main

#  pull_request:

  workflow_dispatch:


permissions:
  contents: read
  packages: write
  actions: read
  
env:
  IMAGE_TAG: test
  
jobs:
        
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
        
      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v4
        with:
          list-files: shell
          filters: |
            inventory-service:
              - 'services/inventory-service/**'
              - 'shared/**'
              - 'package.json'
              - 'package-lock.json'
              - 'docker/**'
              
            auth-service:
              - 'services/auth-service/**'
              - 'shared/**'
              - 'package.json'
              - 'package-lock.json'
              - 'docker/**'  
      
      - name: Show changed services
        run: |
          echo "Changed services: ${{ steps.filter.outputs.changes }}"
  
  build:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: inventory-service
          - service: auth-service
            
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Set up Docker Buildx
        if: contains(fromJson(needs.changes.outputs.services), matrix.service) || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v4
            
      - name: Build image
        if: contains(fromJson(needs.changes.outputs.services), matrix.service) || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile

          build-args: |
            SERVICE_NAME=${{ matrix.service }}

          push: false
          load: true
          
          tags: ${{ matrix.service }}:${{ env.IMAGE_TAG }}

          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Save Docker image
        if: contains(fromJson(needs.changes.outputs.services), matrix.service) || github.event_name == 'workflow_dispatch'
        run: |
          docker save \
            -o ${{ matrix.service }}.tar \
            ${{ matrix.service }}:test

      - name: Upload Docker image
        if: contains(fromJson(needs.changes.outputs.services), matrix.service) || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.service }}-image
          path: ${{ matrix.service }}.tar
          
            
  kind-test:
    needs: 
      - build
    runs-on: ubuntu-latest
    
    env:
      INVENTORY_MONGO_USERNAME: ${{ secrets.INVENTORY_MONGO_USERNAME }}
      INVENTORY_MONGO_PASSWORD: ${{ secrets.INVENTORY_MONGO_PASSWORD }}
      AUTH_MONGO_USERNAME: ${{ secrets.AUTH_MONGO_USERNAME }}
      AUTH_MONGO_PASSWORD: ${{ secrets.AUTH_MONGO_PASSWORD }}
          
    steps:
      - name: Checkout repository 
        uses: actions/checkout@v6

      # -------------------------------------------------------------------------
      # Docker images
      # -------------------------------------------------------------------------

      - name: Download inventory-service image
        uses: actions/download-artifact@v8
        with:
          name: inventory-service-image
          path: /tmp/inventory-service

      - name: Download auth-service image
        uses: actions/download-artifact@v8
        with:
          name: auth-service-image
          path: /tmp/auth-service

      - name: Load Docker image
        run: |
          docker load -i /tmp/inventory-service/inventory-service.tar
          docker load -i /tmp/auth-service/auth-service.tar

      # -------------------------------------------------------------------------
      # Kind
      # -------------------------------------------------------------------------

      - name: Create Kind configuration
        run: |
          cat > /tmp/kind-config.yaml <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
              extraPortMappings:
                - containerPort: 80
                  hostPort: 80
                  protocol: TCP
                - containerPort: 443
                  hostPort: 443
                  protocol: TCP
          EOF

      - name: Create Kind cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: smoke-test
          config: /tmp/kind-config.yaml
          
      - name: Install Traefik
        run: |
          helm repo add traefik https://traefik.github.io/charts
          helm repo update

          helm upgrade --install traefik traefik/traefik \
            --namespace traefik \
            --create-namespace \
            --set ports.web.hostPort=80 \
            --set ports.websecure.hostPort=443 \
            --set service.type=ClusterIP
            
      - name: Wait for Traefik
        run: |
          kubectl wait \
            --namespace traefik \
            --for=condition=ready pod \
            -l app.kubernetes.io/name=traefik \
            --timeout=120s
          
      - name: Verify Kind cluster
        run: |
          echo "=== KUBECONFIG ==="
          echo "$KUBECONFIG"

          echo "=== CONTEXTS ==="
          kubectl config get-contexts

          echo "=== CURRENT CONTEXT ==="
          kubectl config current-context

          echo "=== CLUSTER INFO ==="
          kubectl cluster-info

          echo "=== NODES ==="
          kubectl get nodes -o wide

      - name: Configure E2E hostname
        run: |
          echo "127.0.0.1 api.order-event-platform" | sudo tee -a /etc/hosts

      # -------------------------------------------------------------------------
      # Kubernetes secrets
      # -------------------------------------------------------------------------

      - name: Create namespace
        run: |
          kubectl create namespace order-event-platform --dry-run=client -o yaml | kubectl apply -f -
      
      - name: Generate JWT keypair
        run: |
          mkdir jwt
          openssl ecparam -name prime256v1 -genkey -noout -out jwt/private.pem
          openssl ec -in jwt/private.pem -pubout -out jwt/public.pem
      
      - name: Create Mongo secrets
        run: |
          kubectl create secret generic inventory-service-db-secret \
            --namespace order-event-platform \
            --from-literal=MONGO_USERNAME="$INVENTORY_MONGO_USERNAME" \
            --from-literal=MONGO_PASSWORD="$INVENTORY_MONGO_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
            
          kubectl create secret generic auth-service-db-secret \
            --namespace order-event-platform \
            --from-literal=MONGO_USERNAME="$AUTH_MONGO_USERNAME" \
            --from-literal=MONGO_PASSWORD="$AUTH_MONGO_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -
          
      - name: Create JWT private key secret
        run: |
          kubectl create secret generic auth-service-jwt-private-key-secret \
            --namespace order-event-platform \
            --from-file=private.pem=jwt/private.pem \
            --dry-run=client -o yaml | kubectl apply -f -
            
      - name: Create JWT public key ConfigMap
        run: |
          kubectl create configmap jwt-public-key \
            --namespace order-event-platform \
            --from-literal=public.pem=jwt/public.pem \
            --dry-run=client -o yaml | kubectl apply -f -
      
      # -------------------------------------------------------------------------
      # TLS
      # -------------------------------------------------------------------------
      
      - name: Generate self-signed TLS certificate
        run: |
          openssl req -x509 -nodes -days 365 \
            -newkey rsa:4096 \
            -keyout tls.key \
            -out tls.crt \
            -subj "/CN=api.order-event-platform"
      
      - name: Create TLS secret
        run: |
          kubectl create secret tls order-event-platform-tls \
            --cert=tls.crt \
            --key=tls.key \
            -n order-event-platform

      # -------------------------------------------------------------------------
      # Load images into Kind
      # -------------------------------------------------------------------------

      - name: Load images into Kind
        run: |
          kind load docker-image inventory-service:${{ env.IMAGE_TAG }} --name smoke-test
          kind load docker-image auth-service:${{ env.IMAGE_TAG }} --name smoke-test

      # -------------------------------------------------------------------------
      # Helm
      # -------------------------------------------------------------------------

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Deploy umbrella chart
        run: |
          helm dependency update infra/k8s/helm
          
          helm upgrade --install \
          order-event-platform \
          infra/k8s/helm \
          --namespace order-event-platform \
          -f infra/k8s/helm/values-kind.yaml \
          --set inventory-service.image.tag=test \
          --set auth-service.image.tag=test 

      # -------------------------------------------------------------------------
      # Wait for deployment
      # -------------------------------------------------------------------------

      - name: Wait rollout
        if: success()
        run: |
          for deployment in \
            order-event-platform-inventory-service \
            order-event-platform-auth-service
          do
            kubectl rollout status deployment/$deployment \
              -n order-event-platform \
              --timeout=120s
          done

      - name: Inspect Traefik
        run: |
          echo "=== TRAEFIK PODS ==="
          kubectl get pods -A -l app.kubernetes.io/name=traefik -o wide

          echo
          echo "=== TRAEFIK SERVICES ==="
          kubectl get svc -A -l app.kubernetes.io/name=traefik -o wide

          echo
          echo "=== TRAEFIK DAEMONSETS ==="
          kubectl get daemonset -A -l app.kubernetes.io/name=traefik -o wide

          echo
          echo "=== TRAEFIK DEPLOYMENTS ==="
          kubectl get deployment -A -l app.kubernetes.io/name=traefik -o wide

          echo
          echo "=== TRAEFIK POD YAML ==="
          kubectl get pods -A -l app.kubernetes.io/name=traefik \
            -o yaml
      
      - name: Show resources
        if: always()
        run: |
          kubectl get all -n order-event-platform

      - name: Show logs
        if: failure()
        run: |
          echo "===================="
          echo "PODS"
          echo "===================="
          kubectl get pods -n order-event-platform -o wide

          echo "===================="
          echo "EVENTS"
          echo "===================="
          kubectl get events \
            -n order-event-platform \
            --sort-by='.lastTimestamp'

          echo "===================="
          echo "DEPLOYMENT LOGS"
          echo "===================="

          for deploy in \
            order-event-platform-inventory-service \
            order-event-platform-auth-service
          do
            echo "--------------------"
            echo "$deploy"
            echo "--------------------"

            kubectl logs \
              deployment/$deploy \
              -n order-event-platform \
              --all-containers=true || true
          done

          echo "===================="
          echo "SEED JOB LOGS"
          echo "===================="

          for job in \
            order-event-platform-auth-service-seed \
            order-event-platform-inventory-service-seed
          do
            echo "--------------------"
            echo "$job"
            echo "--------------------"

            kubectl logs \
              job/$job \
              -n order-event-platform || true
          done

      # -------------------------------------------------------------------------
      # NATS
      # -------------------------------------------------------------------------

      - name: Start NATS port-forward
        run: |
          kubectl port-forward \
            -n order-event-platform \
            svc/nats \
            4222:4222 \
            > /tmp/nats-port-forward.log 2>&1 &

          sleep 2

          cat /tmp/nats-port-forward.log

      - name: Verify ingress connectivity
        run: |
          echo "=== TRAEFIK PODS ==="
          kubectl get pods -A -l app.kubernetes.io/name=traefik -o wide || true

          echo
          echo "=== TRAEFIK SERVICES ==="
          kubectl get svc -A -l app.kubernetes.io/name=traefik -o wide || true

          echo
          echo "=== INGRESS ==="
          kubectl get ingress -n order-event-platform -o wide

          echo
          echo "=== DNS ==="
          getent hosts api.order-event-platform || true

          echo
          echo "=== PORT 443 ==="
          nc -vz api.order-event-platform 443 || true

          echo
          echo "=== HTTPS ==="
          curl -vk \
            --connect-timeout 5 \
            https://api.order-event-platform/auth/login \
            || true
      
      # -------------------------------------------------------------------------
      # Node.js / E2E
      # -------------------------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Create E2E environment
        run: |
          cat > tests/e2e/.env.e2e <<'EOF'
          AUTH_SERVICE_URL=https://api.order-event-platform:443/auth/
          INVENTORY_SERVICE_URL=https://api.order-event-platform:443/inventory/
          NATS_URL=nats://127.0.0.1:4222
          IGNORE_TLS_ERRORS=true
          EOF

      - name: Run E2E tests
        run: npm run test:e2e

      # -------------------------------------------------------------------------
      # Playwright artifacts
      # -------------------------------------------------------------------------

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 7
      
      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: tests/e2e/test-results/
          retention-days: 7

  push-images:
    needs:
      - kind-test
      - changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: inventory-service
          - service: auth-service

    steps:
      - name: Download Docker image
        if: contains(fromJson(needs.changes.outputs.services), matrix.service) || github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.service }}-image

      - name: Load Docker image
        if: contains(fromJson(needs.changes.outputs.services), matrix.service) || github.event_name == 'workflow_dispatch'
        run: |
          docker load -i ${{ matrix.service }}.tar

      - name: Login to GHCR
        if: contains(fromJson(needs.changes.outputs.services), matrix.service) || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        if: contains(fromJson(needs.changes.outputs.services), matrix.service) || github.event_name == 'workflow_dispatch'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
          tags: |
            type=sha

      - name: Tag image
        if: contains(fromJson(needs.changes.outputs.services), matrix.service) || github.event_name == 'workflow_dispatch'
        run: |
          while IFS= read -r tag; do
            docker tag ${{ matrix.service }}:${{ env.IMAGE_TAG }} "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"

      - name: Push image
        if: contains(fromJson(needs.changes.outputs.services), matrix.service) || github.event_name == 'workflow_dispatch'
        run: |
          while IFS= read -r tag; do
            docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"

  update-manifests:
    needs:
      - push-images
      - changes
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Python dependencies
        run: pip install ruamel.yaml

      - name: Update image tags
        env:
          SERVICES: ${{ needs.changes.outputs.services }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 <<'PY'
          import json
          import os
          from pathlib import Path
          
          from ruamel.yaml import YAML


          VALUES_FILE = Path("infra/k8s/helm/values-k3s.yaml")

          yaml = YAML()
          yaml.preserve_quotes = True
          yaml.width = 4096

          services = json.loads(os.environ["SERVICES"])

          if os.environ["EVENT_NAME"] == "workflow_dispatch":
            services = [
              "auth-service",
              "inventory-service",
            ]

          image_tag = f"sha-{os.environ['GITHUB_SHA'][:7]}"

          print(f"Services to update: {services}")
          print(f"New image tag: {image_tag}")

          with VALUES_FILE.open("r", encoding="utf-8") as file:
              values = yaml.load(file)

          for service in services:
            if service not in values:
              print(f"Service not found: {service}")
              continue

            print(f"Updating {service} to {image_tag}")

            values[service]["image"]["tag"] = image_tag
            values[service]["image"]["pullPolicy"] = "IfNotPresent"

          with VALUES_FILE.open("w", encoding="utf-8") as file:
              yaml.dump(values, file)
          PY

      - name: Show changes
        run: |
          git diff -- infra/k8s/helm/values-k3s.yaml

      - name: Commit and push manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add infra/k8s/helm/values-k3s.yaml

          if git diff --cached --quiet; then
            echo "No manifest changes to commit"
            exit 0
          fi

          git commit -m "chore(deploy): update image tags [skip ci]"
          git push


   


